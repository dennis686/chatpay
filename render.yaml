services:
  - type: web
    name: chatpay
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: ADMIN_TOKEN
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM_EMAIL
        sync: false
      - key: MAIL_FROM_NAME
        value: Chatpay
      - key: SUPPORT_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: chatpay-db
          property: connectionString
databases:
  - name: chatpay-db
    plan: free
